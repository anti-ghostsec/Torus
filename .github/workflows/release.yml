# Builds the Linux AppImage, the portable Linux and Windows apps and the
# Android app and publishes them as a GitHub release. Runs when a version tag
# (v1.2.3) is pushed, or by hand.
#
# The Android app is signed with Torus's release key, from these repository
# secrets:
#   ANDROID_KEYSTORE_BASE64    the PKCS12 keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password (also the key's); the key's alias is torus
# Without them the release fails: an APK signed with any other key can't be
# installed over the one before. The signed APK must carry the certificate
# whose SHA-256 is in app/src-tauri/gen/android/release-cert.sha256.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No release without the signing key: checked before hours of building.
      - name: Release key present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets: no release without Torus's key."
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis nasm yasm pkg-config autoconf automake libtool \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu aarch64-linux-android

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Video converter (FFmpeg) for Linux, Windows and Android
        run: |
          tools/ffmpeg/build.sh linux
          tools/ffmpeg/build.sh windows
          tools/ffmpeg/build.sh android
          rm -rf tools/ffmpeg/.work

      - name: Front end
        working-directory: app
        run: npm ci

      - name: Linux (portable)
        working-directory: app
        run: npm run portable:linux

      # One file carrying the WebKitGTK libraries the window needs, so
      # nothing has to be installed first.
      - name: Linux (AppImage)
        working-directory: app
        run: |
          node scripts/prepare-bundle.mjs
          npx tauri build --bundles appimage --config src-tauri/tauri.linux.conf.json

      - name: Windows (portable)
        working-directory: app
        run: npm run portable:windows

      - name: Android app
        working-directory: app
        run: |
          chmod +x src-tauri/gen/android/gradlew
          npm run bundle:android

      - name: Sign the Android app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets: no release without Torus's key."
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/37.0.0"
          ks="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$ks" aligned.apk' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          APK=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$ks" --ks-key-alias torus --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "Torus_${TAG#v}_arm64.apk" aligned.apk
          # Signed with Torus's key, not some other one.
          certs=$("$BT/apksigner" verify --print-certs "Torus_${TAG#v}_arm64.apk")
          printf '%s\n' "$certs"
          got=$(printf '%s\n' "$certs" | sed -n 's/^Signer[^:]*certificate SHA-256 digest: //p' | head -1)
          echo "Signing certificate SHA-256: $got"
          [ "$got" = "$(tr -d '[:space:]' < app/src-tauri/gen/android/release-cert.sha256)" ] || { echo "::error::Signed with $got, not Torus's release key" >&2; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/portable/Torus_*_linux_portable.tar.gz "Torus_${TAG#v}_linux_portable.tar.gz"
          cp target/release/bundle/appimage/Torus_*.AppImage "Torus_${TAG#v}_x86_64.AppImage"
          cp target/portable/Torus_*_windows_portable.zip "Torus_${TAG#v}_windows_portable.zip"
          sha256sum "Torus_${TAG#v}_x86_64.AppImage" "Torus_${TAG#v}_linux_portable.tar.gz" "Torus_${TAG#v}_windows_portable.zip" "Torus_${TAG#v}_arm64.apk" > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          **Linux (AppImage, nothing to install):** download `Torus_*_x86_64.AppImage`, make it executable (`chmod +x`, or Properties → Permissions) and run it. Everything Torus keeps, encrypted, is in a `TorusData` folder beside the file, so keep it in a folder of its own. Needs a Linux from 2024 or later (Ubuntu 24.04, Debian 13, Fedora 40, Mint 22). Without FUSE, run it with `--appimage-extract-and-run`.

          **Linux (portable):** for systems that already have WebKitGTK (Debian and Ubuntu: `sudo apt install libwebkit2gtk-4.1-0`). Unpack `Torus_*_linux_portable.tar.gz` and run `Torus/torus`. Nothing is installed and nothing is written outside that folder: everything Torus keeps, encrypted, is in `Torus/TorusData`. Sites are confined using Linux Landlock and seccomp sandboxing.

          **Windows (portable):** unzip `Torus_*_windows_portable.zip` anywhere on an NTFS drive and run `Torus\torus.exe`. Nothing is installed and nothing is written outside that folder: everything Torus keeps, encrypted, is in `Torus\TorusData`. It is not code-signed, so Windows SmartScreen warns the first time: choose "More info", then "Run anyway".

          **Android (64-bit ARM):** install `Torus_*_arm64.apk`. Android asks to allow installing apps from this source.

          Every site's host runs in a sandbox, every uploaded video is encoded afresh before anyone can watch it (up to 10 GB), and nothing is left readable on disk without the passphrase. Check downloads against `SHA256SUMS.txt`.
          NOTES
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Torus $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          gh release upload "$TAG" "Torus_${TAG#v}_x86_64.AppImage" "Torus_${TAG#v}_linux_portable.tar.gz" "Torus_${TAG#v}_windows_portable.zip" "Torus_${TAG#v}_arm64.apk" SHA256SUMS.txt --clobber
